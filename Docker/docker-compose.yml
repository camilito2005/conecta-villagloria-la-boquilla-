services:
  frontend:
    build: ../frontend
    container_name: frontend
    ports:
      - "5173:5173"
    volumes:
      - ../frontend:/app
      - /app/node_modules  # Evita conflictos con node_modules del contenedor
    stdin_open: true
    tty: true
    command: npm run dev  # Asegura que Vite corra en modo desarrollo con recarga en vivo
    environment:
      - CHOKIDAR_USEPOLLING=true  # Permite que los cambios se detecten dentro de Docker

  backend:
    build: ../Backend
    container_name: backend
    ports:
      - "3000:3000"
    volumes:
      - ../Backend:/app
      - /app/node_modules
      - ../Backend/src/Recursos:/usr/src/app/src/Recursos
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: camilo
      DB_NAME: conecta-con-villagloria
      PORT: 3000
      CHOKIDAR_USEPOLLING: true  # 👈 Esto ayuda a que nodemon detecte cambios
    depends_on:
      - db
    command: ["npm", "run", "dev"]

  db:
    image: postgres:16
    container_name: postgres-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: camilo
      POSTGRES_DB: conecta-con-villagloria
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin-1
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - db

volumes:
  postgres_data:

